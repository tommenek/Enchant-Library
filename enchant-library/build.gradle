plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// versions/<mc>.properties holds minecraft_version, fabric_api_version and minecraft_dependency
def mcProps = new Properties()
file("versions/${project.mc}.properties").withInputStream { mcProps.load(it) }
mcProps.each { k, v -> ext.set(k, v) }

version = "${project.mod_version}+${project.mc}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.x is unobfuscated: no mappings line, and plain implementation (no "mod" prefix)
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_dependency", project.minecraft_dependency
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version, "minecraft_dependency": inputs.properties.minecraft_dependency
    }
}

// src/mc<mc>/java holds per-version replacements: a file there replaces the one with the same path in src/main/java
def overlay = file("src/mc${project.mc}/java")
if (overlay.exists()) {
    def replaced = fileTree(overlay).collect { overlay.toPath().relativize(it.toPath()).toString().replace("\\", "/") } as Set
    sourceSets.main.java.srcDir overlay
    sourceSets.main.java.exclude { el -> !el.file.path.startsWith(overlay.path) && replaced.contains(el.relativePath.pathString) }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
